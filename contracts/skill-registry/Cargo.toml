[package]
name = "skill-registry"
version = "0.1.0"
edition = "2021"
authors = ["Verteus Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.5"
near-sdk = { version = "5.5", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.5", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
