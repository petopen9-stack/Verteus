[package]
name = "skill-registry"
version = "0.1.0"
edition = "2021"
authors = ["Verteus Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
coding = true
lto = true
opt-level = "z"
overflow-checks = true
